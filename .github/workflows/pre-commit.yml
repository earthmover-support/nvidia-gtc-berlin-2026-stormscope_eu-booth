name: Pre-commit Checks

# PR-only: the required PR checks gate every merge, so re-running the same hooks
# on the merge commit (push to main) would just double-bill identical work.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Cache the hook environments pre-commit builds. Keyed on the config: a
      # hook/rev change busts the cache; restore-keys warm-starts otherwise.
      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # ruff runs in its own workflow (lint.yml) with inline annotations.
      - name: Run pre-commit hooks
        env:
          SKIP: ruff-check
        run: uvx pre-commit run --all-files --show-diff-on-failure
