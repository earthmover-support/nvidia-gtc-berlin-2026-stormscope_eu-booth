[project]
name = "nvidia-gtc-berlin-2026-stormscope_eu-booth"
version = "0.1.0"
description = "StormScope-EU nowcasting on MTG-I1 FCI -> Arraylake/Icechunk (GTC Berlin demo)"
requires-python = "==3.12.*"
dependencies = [
    # earth2studio bare (no [data] extra): the full extra pulls cfgrib /
    # eccodes / eccodeslib, which have no macOS arm64 wheels (eccodeslib is
    # linux-only), so `uv sync` fails on a Mac. The pipeline only needs the
    # MeteosatFCI source (eumdac + netCDF4) and the Icechunk ingest path
    # (arraylake + icechunk), listed explicitly below. The Coiled GPU env
    # still installs the full earth2studio[data]; see
    # coiled/requirements-stormscope-eu.txt.
    "earth2studio @ git+https://github.com/NVIDIA/earth2studio.git",
    "eumdac>=3.1.0",
    # contents of the `stormscope` extra, minus earth2studio[utils]
    # ([utils] pulls earth2grid, which is git-only / source build)
    "nvidia-physicsnemo>=2.1.0",  # stormscope_meteosat imports it; installs fine on macOS
    "nvtx>=0.2.11",
    "omegaconf>=2.3.0",
    "scipy>=1.15.2",
    "torch>=2.6",
    # ingest target (not in coiled/requirements-stormscope-eu.txt, which relies on
    # the Coiled base image; needed explicitly here)
    "arraylake>=0.14",
    "icechunk>=1.0",
    "xarray>=2025.1",
    "zarr>=3",
    # plotting / misc
    "cartopy",
    "matplotlib",
    "ipywidgets",
    "python-dotenv",
    "tqdm",
    "coiled>=1.135.3",   # launch the GPU runs from here
]

[project.optional-dependencies]
# NATTEN is not used by stormscope_meteosat (only by stormscope.py / atlas.py), and
# it ships prebuilt wheels only for linux+CUDA (--find-links https://whl.natten.org/,
# see coiled/requirements-stormscope-eu.txt) -- building it from the PyPI sdist
# silently produces a package without libnatten. Do not install this on macOS.
gpu = [
    "natten>=0.21.6",
]

[tool.uv.sources]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",  # VS Code notebook kernel
    "jupyterlab>=4.6.4",
]

[tool.uv]
# eccodeslib (via earth2studio[data]) has released versions with linux-only wheels
# (e.g. 2.48.2.27); require a resolution that also installs on Apple Silicon.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
